name: Paquete de Windows
# Arma MrCook-POS-<versión>-win-x64.zip (Node oficial verificado + app + interfaz).
# Se dispara a mano (Actions → Paquete de Windows → Run workflow) o al publicar un tag v*.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: MrCook-POS-win-x64
          path: release/MrCook-POS-*-win-x64.zip
          if-no-files-found: error
      - name: Adjuntar al release (solo tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/MrCook-POS-*-win-x64.zip
